[project]
name = "opspilot-lite"
version = "0.1.0"
description = "Human-in-the-loop AI automation for real business workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hisham"}]
keywords = ["ai", "automation", "fastapi", "workflow", "human-in-the-loop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "sqlmodel>=0.0.21,<0.0.23",
    "pydantic>=2.7,<2.12",
    "pydantic-settings>=2.2,<2.8",
    "jinja2>=3.1,<3.2",
    "python-multipart>=0.0.9,<0.0.13",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<0.25", "ruff>=0.5,<0.9"]

[project.scripts]
opspilot = "app.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
